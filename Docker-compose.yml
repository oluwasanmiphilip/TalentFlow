version: '3.9'
services:
  api:
    build:
      context: .
      dockerfile: TalentFlow.Api/Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Production=Host=postgres;Port=5432;Database=talentflow_db;Username=talentflow_user;Password=secure_password
      - RabbitMQ__Production__Host=rabbitmq
      - RabbitMQ__Production__Port=5672
      - RabbitMQ__Production__UserName=guest
      - RabbitMQ__Production__Password=guest
    depends_on:
      - rabbitmq
      - postgres

  worker:
    build:
      context: .
      dockerfile: TalentFlow.Workers/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Production=Host=postgres;Port=5432;Database=talentflow_db;Username=talentflow_user;Password=secure_password
      - RabbitMQ__Production__Host=rabbitmq
      - RabbitMQ__Production__Port=5672
      - RabbitMQ__Production__UserName=guest
      - RabbitMQ__Production__Password=guest
    depends_on:
      - rabbitmq
      - postgres

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672" # management UI

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=talentflow_db
      - POSTGRES_USER=talentflow_user
      - POSTGRES_PASSWORD=secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
